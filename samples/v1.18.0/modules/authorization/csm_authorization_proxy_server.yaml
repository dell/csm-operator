apiVersion: storage.dell.com/v1
kind: ContainerStorageModule
metadata:
  name: authorization
  namespace: authorization
spec:
  version: v1.18.0
  modules:
    # Authorization: enable csm-authorization proxy server for RBAC
    - name: authorization-proxy-server
      # enable: Enable/Disable csm-authorization
      enabled: true
      forceRemoveModule: true
      # metrics: Optional metrics configuration for the proxy-server Prometheus endpoint.
      # The operator automatically creates a Service and optionally a ServiceMonitor.
      metrics:
        # enabled: Enable/Disable the proxy-server metrics endpoint.
        # Allowed values: true, false
        # Default value: true
        enabled: true
        # port: Port on which the proxy-server metrics endpoint is exposed.
        # Allowed values: 1-65535
        # Default value: 2112
        port: 2112
        # tlsCertSecret: Name of a Kubernetes TLS Secret used to serve metrics over HTTPS.
        # Leave empty to serve metrics over plain HTTP.
        # Allowed values: Kubernetes secret name, empty string
        # Default value: ""
        tlsCertSecret: ""
        # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the proxy-server.
        # Requires the Prometheus Operator CRDs to be installed in the cluster.
        serviceMonitor:
          # enabled: Enable/Disable ServiceMonitor for proxy-server metrics.
          # Allowed values: true, false
          # Default value: false
          enabled: false
          # interval: Prometheus scrape interval for the metrics endpoint.
          # Allowed values: Go duration string (e.g., 30s, 1m)
          # Default value: "30s"
          interval: "30s"
          # scrapeTimeout: Prometheus scrape timeout for the metrics endpoint.
          # Allowed values: duration string, empty string
          # Default value: ""
          scrapeTimeout: ""
          # insecureSkipVerify: Skip TLS certificate verification when scraping.
          # Only applies when tlsCertSecret is set.
          # Allowed values: true, false
          # Default value: false
          insecureSkipVerify: false
        # prometheusRule: Creates a Prometheus Operator PrometheusRule for alert rules.
        # Requires the Prometheus Operator CRDs to be installed in the cluster.
        prometheusRule:
          # enabled: Enable/Disable PrometheusRule for authorization alert rules.
          # Allowed values: true, false
          # Default value: true
          enabled: true
          # authFailureRateThreshold: Percentage threshold (0-100) for high authorization failure rate alert.
          # The value is divided by 100 when substituted into Prometheus expressions.
          # Allowed values: 0-100
          # Default value: 10 (10%)
          authFailureRateThreshold: 10
          # authLatencyQuantile: Quantile percentage (0-100) for authorization latency alert.
          # The value is divided by 100 when substituted into Prometheus expressions (e.g., 95 for 95th percentile).
          # Allowed values: 0-100
          # Default value: 95 (95th percentile)
          authLatencyQuantile: 95
          # authLatencyThresholdSeconds: Latency threshold in seconds for high authorization latency alert.
          # Allowed values: positive integer
          # Default value: 2 (2 seconds)
          authLatencyThresholdSeconds: 2
      components:
        # For Kubernetes Container Platform only (ignored on OpenShift)
        # enabled: Enable/Disable Gateway API Controller (NGINX Gateway Fabric)
        # Allowed values:
        #   true: enable deployment of Gateway API Controller
        #   false: disable deployment of Gateway API Controller only if you have your own gateway.
        # Default value: true
        - name: nginx-gateway-fabric
          enabled: true
        # enabled: Enable/Disable cert-manager
        # Allowed values:
        #   true: enable deployment of cert-manager
        #   false: disable deployment of cert-manager only if it's already deployed
        # Default value: true
        - name: cert-manager
          enabled: true
        - name: proxy-server
          # enable: Enable/Disable csm-authorization proxy server
          enabled: true
          proxyServiceReplicas: 1
          tenantServiceReplicas: 1
          roleServiceReplicas: 1
          storageServiceReplicas: 1
          authorizationControllerReplicas: 1
          leaderElection: true
          # controllerReconcileInterval: interval for the authorization controllers to reconcile with Redis.
          controllerReconcileInterval: 3m
          # certificate: base64-encoded certificate for cert/private-key pair -- add certificate here to use custom certificates
          # for self-signed certs, leave empty string
          # Allowed values: string
          certificate: ""
          # privateKey: base64-encoded private key for cert/private-key pair -- add private key here to use custom certificates
          # for self-signed certs, leave empty string
          # Allowed values: string
          privateKey: ""
          # proxy-server Gateway will use this hostname
          # NOTE: an additional hostname can be configured in gateway.hosts
          # NOTE: proxy-server Gateway is configured to accept IP address connections so hostnames are not required
          hostname: "csm-authorization.com"
          # gateway configuration for proxy-server (v2.5.0+)
          gateway:
            gatewayClassName: nginx
            # additional hostnames for the proxy-server HTTPRoute
            hosts:
            # - [namespace]-gateway-nginx.[namespace].svc.cluster.local
            # additional annotations for the proxy-server HTTPRoute
            annotations: {}
          # openTelemetryCollectorAddress: the OTLP receiving endpoint using gRPC
          openTelemetryCollectorAddress: ""
          # Optional: set X_CSI_AUTHORIZATION_IP_FAMILY to ipv4 on clusters where IPv6 is disabled.
          # When unset, nginx uses its default IP family behavior.
          # Allowed values: "ipv4" (IPv4-only), "ipv6" (IPv6-only)
          # envs:
          #   - name: X_CSI_AUTHORIZATION_IP_FAMILY
          #     value: "ipv4"
        - name: redis
          # Redis credentials are required and can be provided in one of two ways:
          # 1. Directly via redisUsername/redisPassword (a Kubernetes secret will be created automatically)
          # 2. Via a Secret Store CSI driver (specify the SecretProviderClass details below)
          #
          # Option 1: Provide credentials directly
          redisUsername: ""
          redisPassword: ""
          # Option 2: Use a Secret Store CSI driver
          # redisSecretProviderClass:
          #   Name of the SecretProviderClass that holds the Redis secretObject.
          #   - secretProviderClassName: ""
          #   Name of the Kubernetes secret (created by the Secret Store CSI driver) that contains Redis credentials.
          #   redisSecretName: ""
          #   Key in the secret that stores the Redis username.
          #   redisUsernameKey: ""
          #   Key in the secret that stores the Redis password.
          #   redisPasswordKey: ""
          #   Optional paths to the Conjur secrets that store the Redis username and password
          #   conjur:
          #    usernamePath: secrets/redis-username
          #    passwordPath: secrets/redis-password
          redisCommander: rediscommander
          redisName: redis-csm
          redisReplicas: 5
          sentinel: sentinel

        - name: config
          # Optional:
          # Config secret configuration for JWT signing secret:
          # If using a Secret Store CSI driver, specify the SecretProviderClass details that holds the config secretObject.
          # Otherwise leave the fields blank and create the "karavi-config-secret" Kubernetes secret.
          configSecretProviderClass:
            # Name of the SecretProviderClass that holds the config secretObject.
            - secretProviderClassName: ""
              # Name of the Kubernetes secret (created by the Secret Store CSI driver) that contains the config secret.
              configSecretName: ""
              # Uncomment this section if using Conjur to store the config secret, otherwise leave commented out.
              # Path for Conjur secret that stores the config secret.
              # conjur:
              #   secretPath: secrets/config-object
        # Comment and uncomment the appropriate sections below to use the desired method.
        # Storage system credentials can be provided in one of two ways:
        # 1. Using a SecretProviderClass (for dynamic secrets from external providers)
        # 2. Using a Kubernetes Secret (for static credentials)
        # Only one of the two can be specified at a time.
        - name: storage-system-credentials
          secretProviderClasses:
            vault:
              - secret-provider-class-1
              - secret-provider-class-2
              # conjur:
              #   - name: secret-provider-class-3
              #     paths:
              #       - usernamePath: secrets/username1
              #         passwordPath: secrets/password1
              #       - usernamePath: secrets/username2
              #         passwordPath: secrets/password2
              #   - name: secret-provider-class-4
              #     paths:
              #       - usernamePath: secrets/username3
              #         passwordPath: secrets/password3
              # secrets:
              #   - secret-1
              #   - secret-2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: csm-config-params
  namespace: authorization
data:
  csm-config-params.yaml: |-
    CONCURRENT_STORAGE_REQUESTS: 10
    CSI_LOG_LEVEL: info
    CSI_LOG_FORMAT: JSON
    STORAGE_CAPACITY_POLL_INTERVAL: 30m
