apiVersion: storage.dell.com/v1
kind: ContainerStorageModule
metadata:
  name: isilon
  namespace: isilon
spec:
  version: v1.18.0
  driver:
    csiDriverType: "isilon"
    csiDriverSpec:
      # in OCP <= 4.16 and K8s <= 1.29, fsGroupPolicy is an immutable field
      # fsGroupPolicy: Defines if the underlying volume supports changing ownership and permission of the volume before being mounted.
      # Allowed values: ReadWriteOnceWithFSType, File , None
      # Default value: ReadWriteOnceWithFSType
      fSGroupPolicy: "ReadWriteOnceWithFSType"
      # storageCapacity: Helps the scheduler to schedule the pod on a node satisfying the topology constraints, only if the requested capacity is available on the storage array
      # Allowed values:
      #   true: enable storage capacity tracking
      #   false: disable storage capacity tracking
      storageCapacity: true
    authSecret: isilon-creds
    # Controller count
    # Allowed values: n, where n > 0
    # Default value: 2
    replicas: 2
    dnsPolicy: ClusterFirstWithHostNet
    # Uninstall CSI Driver and/or modules when CR is deleted
    forceRemoveDriver: true
    common:
      imagePullPolicy: IfNotPresent
      envs:
        # X_CSI_VERBOSE: Indicates what content of the OneFS REST API message should be logged in debug level logs
        # Allowed Values:
        #   0: log full content of the HTTP request and response
        #   1: log without the HTTP response body
        #   2: log only 1st line of the HTTP request and response
        # Default value: 0
        - name: X_CSI_VERBOSE
          value: "1"
        # X_CSI_ISI_PORT: Specify the HTTPs port number of the PowerScale OneFS API server
        # This value acts as a default value for endpointPort, if not specified for a cluster config in secret
        # Allowed value: valid port number
        # Default value: 8080
        - name: X_CSI_ISI_PORT
          value: "8080"
        # X_CSI_ISI_PATH: The base path for the volumes to be created on PowerScale cluster.
        # This value acts as a default value for isiPath, if not specified for a cluster config in secret
        # Ensure that this path exists on PowerScale cluster.
        # Allowed values: unix absolute path
        # Default value: /ifs
        # Examples: /ifs/data/csi, /ifs/engineering
        - name: X_CSI_ISI_PATH
          value: "/ifs/data/csi"
        # X_CSI_ISI_NO_PROBE_ON_START: Indicates whether the controller/node should probe all the PowerScale clusters during driver initialization
        # Allowed values:
        #   true : do not probe all PowerScale clusters during driver initialization
        #   false: probe all PowerScale clusters during driver initialization
        # Default value: false
        - name: X_CSI_ISI_NO_PROBE_ON_START
          value: "false"
        # X_CSI_ISI_AUTOPROBE: automatically probe the PowerScale cluster if not done already during CSI calls.
        # Allowed values:
        #   true : enable auto probe.
        #   false: disable auto probe.
        # Default value: false
        - name: X_CSI_ISI_AUTOPROBE
          value: "true"
        # X_CSI_ISI_SKIP_CERTIFICATE_VALIDATION: Specify whether the PowerScale OneFS API server's certificate chain and host name should be verified.
        # Formerly this attribute was named as "X_CSI_ISI_INSECURE"
        # This value acts as a default value for skipCertificateValidation, if not specified for a cluster config in secret
        # Allowed values:
        #   true: skip OneFS API server's certificate verification
        #   false: verify OneFS API server's certificates
        # Default value: true
        - name: X_CSI_ISI_SKIP_CERTIFICATE_VALIDATION
          value: "true"
        # X_CSI_ISI_AUTH_TYPE: Specify the authentication method to be used.
        # Allowed values:
        #   0: basic authentication
        #   1: session-based authentication
        # Default value: 1
        - name: X_CSI_ISI_AUTH_TYPE
          value: "1"
        # X_CSI_CUSTOM_TOPOLOGY_ENABLED: Specify if custom topology label <provisionerName>.dellemc.com/<powerscalefqdnorip>:<provisionerName>
        # has to be used for making connection to backend PowerScale Array.
        # If X_CSI_CUSTOM_TOPOLOGY_ENABLED is set to true, then do not specify allowedTopologies in storage class.
        # Allowed values:
        #   true : enable custom topology
        #   false: disable custom topology
        # Default value: false
        - name: X_CSI_CUSTOM_TOPOLOGY_ENABLED
          value: "false"
        # X_CSI_ISI_NFS_MOUNT_FQDN: Specify the global fallback FQDN for NFS mount targets.
        # StorageClass SmartConnectZoneFQDN takes precedence, followed by the selected cluster's
        # nfsMountFQDN. NFSTransportSecurity remains explicit and StorageClass-scoped.
        # Allowed values: A valid FQDN (e.g., "smartconnect.isilon.example.com")
        # Optional: true
        # Default value: ""
        - name: X_CSI_ISI_NFS_MOUNT_FQDN
          value: ""
        # X_CSI_ISI_TLS_HANDSHAKE_TIMEOUT_SECONDS: Specify the timeout, in seconds, to wait for the
        # kernel TLS handshake (performed by tlshd) to complete when mounting with NFS over mTLS.
        # Applies only to the mTLS mount path.
        # Allowed values: A positive integer
        # Default value: "30"
        - name: X_CSI_ISI_TLS_HANDSHAKE_TIMEOUT_SECONDS
          value: "30"
        # Specify kubelet config dir path.
        # Ensure that the config.yaml file is present at this path.
        # Default value: /var/lib/kubelet
        - name: KUBELET_CONFIG_DIR
          value: "/var/lib/kubelet"
        # certSecretCount: Represents number of certificate secrets, which user is going to create for
        # ssl authentication. (isilon-cert-0..isilon-cert-n)
        # Allowed values: n, where n > 0
        # Default value: None
        - name: "CERT_SECRET_COUNT"
          value: "1"
        # CSI driver log level
        # Allowed values: "error", "warn"/"warning", "info", "debug"
        # Default value: "info"
        - name: "CSI_LOG_LEVEL"
          value: "info"
        # CSI driver log format
        # Allowed values: "text" or "json"
        # Default value: "json"
        - name: "CSI_LOG_FORMAT"
          value: "json"
        # GOISILON_DEBUG: Enable/disable debug logs from gopowerscale library.
        # Default value: false
        - name: "GOISILON_DEBUG"
          value: "false"
        # AZ_RECONCILE_INTERVAL: Interval to monitor and reconcile network interface labels on nodes.
        # Allowed values: Number followed by unit of time (s,m,h)
        # Default value: 1h
        - name: "AZ_RECONCILE_INTERVAL"
          value: "1h"
    # metrics: Configure driver metrics endpoint
    # The operator automatically wires the TLS secret and creates Service/ServiceMonitor/PodMonitor resources.
    metrics:
      # enabled: Enable/Disable driver metrics endpoint
      # Allowed values: true, false
      # Default value: false
      enabled: false
      # port: Port used by driver metrics endpoint
      # Allowed values: 1-65535
      # Default value: 8443
      port: 8443
      # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
      # When set the operator mounts the secret and configures HTTPS automatically.
      # Leave unset to serve metrics over plain HTTP.
      tlsCertSecret: ""
      # leaderElection: Configure leader election for array-level metrics collection.
      # Only the leader controller will collect array-level metrics to avoid duplicate API calls.
      leaderElection:
        # enabled: Enable leader election for array-level metrics collection
        # Allowed values: true, false
        # Default value: false
        enabled: false
        # leaseDuration: Duration that non-leader candidates will wait to acquire the lease
        # Allowed values: Go duration string (e.g., 60s, 1m)
        # Default value: 60s
        leaseDuration: 60s
        # renewDeadline: Duration that the acting leader will retry refreshing leadership before giving up
        # Allowed values: Go duration string (e.g., 40s, 1m)
        # Default value: 40s
        renewDeadline: 40s
        # retryPeriod: Duration the LeaderElector clients should wait between tries of actions
        # Allowed values: Go duration string (e.g., 5s, 10s)
        # Default value: 5s
        retryPeriod: 5s
      # collection: Controls metrics collection cadence and cache behavior inside the driver.
      collection:
        # interval: How frequently metrics are collected from the array
        # Allowed values: Go duration string (e.g., 30s, 1m)
        # Default value: 30s
        interval: 30s
        # cacheTTL: How long collected metric responses are cached
        # Allowed values: Go duration string (e.g., 25s, 1m)
        # Default value: 25s
        cacheTTL: 25s
      # array: Controls array-facing metrics collection request behavior.
      array:
        # rateLimit: Max allowed PowerScale API requests per second during metrics collection
        # Allowed values: Positive integer
        # Default value: 100
        rateLimit: 100
        # timeout: Per-request timeout for PowerScale API calls made during metrics collection
        # Allowed values: Go duration string (e.g., 30s, 1m)
        # Default value: 30s
        timeout: 30s
        circuitBreaker:
          # threshold: Number of consecutive failures before the circuit opens
          # Allowed values: Positive integer
          # Default value: 3
          threshold: 3
          # resetTimeout: How long the circuit stays open before allowing a test request (half-open)
          # Allowed values: Go duration string (e.g., 30s, 1m)
          # Default value: 30s
          resetTimeout: 30s
      # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
      serviceMonitor:
        # enabled: Enable/Disable ServiceMonitor for driver metrics
        # Allowed values: true, false
        # Default value: false
        enabled: false
        # interval: Interval at which metrics should be scraped
        # Allowed values: Go duration string (e.g., 30s, 1m)
        # Default value: 30s
        interval: 30s
        # scrapeTimeout: Timeout after which the scrape is ended
        # Allowed values: Go duration string (e.g., 10s)
        # Default value: ""
        scrapeTimeout: ""
        # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
        # Allowed values: true, false
        # Default value: false
        insecureSkipVerify: false
      # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
      podMonitor:
        # enabled: Enable/Disable PodMonitor for driver metrics
        # Allowed values: true, false
        # Default value: false
        enabled: false
        # interval: Interval at which metrics should be scraped
        # Allowed values: Go duration string (e.g., 30s, 1m)
        # Default value: 30s
        interval: 30s
        # scrapeTimeout: Timeout after which the scrape is ended
        # Allowed values: Go duration string (e.g., 10s)
        # Default value: ""
        scrapeTimeout: ""
        # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
        # Allowed values: true, false
        # Default value: false
        insecureSkipVerify: false
      # prometheusRule: Creates a Prometheus Operator PrometheusRule containing PowerScale CSI alert rules.
      prometheusRule:
        # enabled: Enable/Disable PrometheusRule creation for driver alerts
        # Allowed values: true, false
        # Default value: true
        enabled: true
        # volumeOperationFailureThreshold: Volume operation failure count threshold in 5m window
        volumeOperationFailureThreshold: 3
        # quotaWarningThreshold: Warning threshold for quota utilization in whole percent (80 = 80%)
        quotaWarningThreshold: 80
        # quotaCriticalThreshold: Critical threshold for quota utilization in whole percent (90 = 90%)
        quotaCriticalThreshold: 90
        # nodepoolWarningThreshold: Warning threshold for node pool utilization in whole percent
        nodepoolWarningThreshold: 80
        # nodepoolCriticalThreshold: Critical threshold for node pool utilization in whole percent
        nodepoolCriticalThreshold: 90
        # apiErrorRateThreshold: Warning threshold for API error rate in whole percent
        apiErrorRateThreshold: 10
        # apiErrorRateWindow: Prometheus duration string used for API error rate evaluation
        apiErrorRateWindow: "5m"
        # cpuWarningThreshold: Warning threshold for driver CPU utilization in whole percent
        cpuWarningThreshold: 80
        # memoryWarningThreshold: Warning threshold for driver memory usage in bytes (2 GiB)
        memoryWarningThreshold: 2147483648
        # nfsV3LatencyWarningSeconds: Warning threshold for NFSv3 p99 latency in seconds
        nfsV3LatencyWarningSeconds: 10
        # nfsV4LatencyWarningSeconds: Warning threshold for NFSv4 p99 latency in seconds
        nfsV4LatencyWarningSeconds: 10
        # driverCrashLoopRestartThreshold: Restart count threshold for crash loop detection
        driverCrashLoopRestartThreshold: 3
        # driverCrashLoopWindow: Prometheus duration string for crash loop restart delta evaluation
        driverCrashLoopWindow: "15m"
    controller:
      envs:
        # X_CSI_ISI_QUOTA_ENABLED: Indicates whether the provisioner should attempt to set (later unset) quota
        # on a newly provisioned volume.
        # This requires SmartQuotas to be enabled on PowerScale cluster.
        # Allowed values:
        #   true: set quota for volume
        #   false: do not set quota for volume
        - name: X_CSI_ISI_QUOTA_ENABLED
          value: "true"
        # X_CSI_ISI_ACCESS_ZONE: The name of the access zone a volume can be created in.
        # If storageclass is missing with AccessZone parameter, then value of X_CSI_ISI_ACCESS_ZONE is used for the same.
        # Default value: System
        # Examples: System, zone1
        - name: X_CSI_ISI_ACCESS_ZONE
          value: "System"
        # X_CSI_ISI_VOLUME_PATH_PERMISSIONS: The permissions for isi volume directory path
        # This value acts as a default value for isiVolumePathPermissions, if not specified for a cluster config in secret
        # Allowed values: valid octal mode number
        # Default value: "0777"
        # Examples: "0777", "777", "0755"
        - name: X_CSI_ISI_VOLUME_PATH_PERMISSIONS
          value: "0777"
        # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from Controller plugin- volume status, volume condition.
        # Install the 'external-health-monitor' sidecar accordingly.
        # Allowed values:
        #   true: enable checking of health condition of CSI volumes
        #   false: disable checking of health condition of CSI volumes
        # Default value: false
        - name: X_CSI_HEALTH_MONITOR_ENABLED
          value: "false"
        # X_CSI_ISI_IGNORE_UNRESOLVABLE_HOSTS: Ignore unresolvable hosts on the OneFS.
        # When set to true, OneFS allows new host to add to existing export list though any of the existing hosts from the
        # same exports are unresolvable/doesn't exist anymore.
        # Allowed values:
        #   true: ignore existing unresolvable hosts and append new host to the existing export
        #   false: exhibits OneFS default behavior i.e. if any of existing hosts are unresolvable while adding new one it fails
        # Default value: false
        - name: X_CSI_ISI_IGNORE_UNRESOLVABLE_HOSTS
          value: "false"
        # X_CSI_MAX_PATH_LIMIT: this parameter is used for setting the maximum Path length for the given volume.
        # Default value: 192
        # Examples: 192, 256
        - name: X_CSI_MAX_PATH_LIMIT
          value: "192"
        # X_CSI_ALLOWED_NETWORKS: Custom networks for PowerScale export
        # Specify list of networks which can be used for NFS I/O traffic; CIDR format should be used.
        # Allowed values: list of one or more networks
        # Default value: None
        # Provide them in the following format: "[net1, net2]"
        # CIDR format should be used
        # eg: "[192.168.1.0/24, 192.168.100.0/22]"
        - name: X_CSI_ALLOWED_NETWORKS
          value: ""
        # X_CSI_ALLOWED_NETWORKS_MODE: Mode for multi-NIC network selection
        # Allowed values:
        #   single: Use first matching IP (default, backward compatible)
        #   multi: Use all matching IPs from node labels
        # Default value: single
        - name: X_CSI_ALLOWED_NETWORKS_MODE
          value: "single"
      # nodeSelector: Define node selection constraints for pods of controller deployment.
      # For the pod to be eligible to run on a node, the node must have each
      # of the indicated key-value pairs as labels.
      # Leave as blank to consider all nodes
      # Allowed values: map of key-value pairs
      # Default value: None
      nodeSelector:
      # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
      #  node-role.kubernetes.io/control-plane: ""

      # tolerations: Define tolerations for the controller deployment, if required.
      # Default value: None
      tolerations:
      # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
      # - key: "node-role.kubernetes.io/control-plane"
      #   operator: "Exists"
      #   effect: "NoSchedule"
    node:
      envs:
        # X_CSI_MAX_VOLUMES_PER_NODE: Specify default value for maximum number of volumes that controller can publish to the node.
        # If value is zero CO SHALL decide how many volumes of this type can be published by the controller to the node.
        # This limit is applicable to all the nodes in the cluster for which node label 'max-isilon-volumes-per-node' is not set.
        # Allowed values: n, where n >= 0
        # Default value: 0
        - name: X_CSI_MAX_VOLUMES_PER_NODE
          value: "0"
        # X_CSI_ALLOWED_NETWORKS: Custom networks for PowerScale export
        # Specify list of networks which can be used for NFS I/O traffic; CIDR format should be used.
        # Allowed values: list of one or more networks
        # Default value: None
        # Provide them in the following format: "[net1, net2]"
        # CIDR format should be used
        # eg: "[192.168.1.0/24, 192.168.100.0/22]"
        - name: X_CSI_ALLOWED_NETWORKS
          value: ""
        # X_CSI_ALLOWED_NETWORKS_MODE: Mode for multi-NIC network selection
        # Allowed values:
        #   single: Use first matching IP (default, backward compatible)
        #   multi: Use all matching IPs from node labels
        # Default value: single
        - name: X_CSI_ALLOWED_NETWORKS_MODE
          value: "single"
        # X_CSI_HEALTH_MONITOR_ENABLED: Enable/Disable health monitor of CSI volumes from Controller plugin- volume status, volume condition.
        # Install the 'external-health-monitor' sidecar accordingly.
        # Allowed values:
        #   true: enable checking of health condition of CSI volumes
        #   false: disable checking of health condition of CSI volumes
        # Default value: false
        - name: X_CSI_HEALTH_MONITOR_ENABLED
          value: "false"
        # X_CSI_MAX_PATH_LIMIT: this parameter is used for setting the maximum Path length for the given volume.
        # Default value: 192
        # Examples: 192, 256
        - name: X_CSI_MAX_PATH_LIMIT
          value: "192"
        # X_CSI_ISILON_ENABLE_DRIVER_FSGROUP_CHOWN: Enable/Disable driver-side parallel recursive chown for export-backed volumes
        # Allowed values: true, false
        # Default value: true
        - name: X_CSI_ISILON_ENABLE_DRIVER_FSGROUP_CHOWN
          value: "true"
        # X_CSI_ISILON_CHOWN_WORKERS: Number of parallel os.Chown workers for recursive fsGroup application
        # Allowed values: integer >= 1
        # Default value: 8
        - name: X_CSI_ISILON_CHOWN_WORKERS
          value: "8"
        # X_CSI_ISILON_CHOWN_WRITEBATCH: Number of completed file paths to buffer before writing the resumable state file
        # Allowed values: integer >= 1
        # Default value: 1000
        - name: X_CSI_ISILON_CHOWN_WRITEBATCH
          value: "1000"
        # X_CSI_ISILON_CHOWN_TIMEOUT_SECONDS: Per-NodeStageVolume/NodePublishVolume timeout for recursive chown
        # Allowed values: integer >= 1
        # Default value: 30
        - name: X_CSI_ISILON_CHOWN_TIMEOUT_SECONDS
          value: "30"
      # nodeSelector: Define node selection constraints for pods of node daemonset
      # For the pod to be eligible to run on a node, the node must have each
      # of the indicated key-value pairs as labels.
      # Leave as blank to consider all nodes
      # Allowed values: map of key-value pairs
      # Default value: None
      nodeSelector:
      # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
      #  node-role.kubernetes.io/control-plane: ""

      # tolerations: Define tolerations for the node daemonset, if required.
      # Default value: None
      tolerations:
      # - key: "node.kubernetes.io/memory-pressure"
      #   operator: "Exists"
      #   effect: "NoExecute"
      # - key: "node.kubernetes.io/disk-pressure"
      #   operator: "Exists"
      #   effect: "NoExecute"
      # - key: "node.kubernetes.io/network-unavailable"
      #   operator: "Exists"
      #   effect: "NoExecute"
      # Uncomment if nodes you wish to use have the node-role.kubernetes.io/control-plane taint
      # - key: "node-role.kubernetes.io/control-plane"
      #   operator: "Exists"
      #   effect: "NoSchedule"
      # Uncomment if CSM for Resiliency and CSI Driver pods monitor is enabled
      # - key: "offline.isilon.storage.dell.com"
      #   operator: "Exists"
      #   effect: "NoSchedule"
      # - key: "isilon.podmon.storage.dell.com"
      #   operator: "Exists"
      #   effect: "NoSchedule"
    sideCars:
      - name: provisioner
        args: ["--volume-name-prefix=csivol"]
      # health monitor is disabled by default, refer to driver documentation before enabling it
      # Default monitor-interval: 60s
      - name: external-health-monitor
        enabled: false
        args: ["--monitor-interval=60s"]
        # Uncomment the following to configure how often external-provisioner polls the driver to detect changed capacity
        # Configure when the storageCapacity is set as "true"
        # Allowed values: 1m,2m,3m,...,10m,...,60m etc. Default value: 5m
        # - name: provisioner
        #  args: ["--capacity-poll-interval=5m"]
  modules:
    # Authorization: enable csm-authorization for RBAC
    - name: authorization
      # enable: Enable/Disable csm-authorization
      # Default value: false
      enabled: false
      components:
        - name: karavi-authorization-proxy
          envs:
            # proxyHost: hostname of the csm-authorization server
            # Default value: none
            - name: "PROXY_HOST"
              value: "csm-authorization.com"
            # skipCertificateValidation: Enable/Disable certificate validation of the csm-authorization server
            # Default value: "true"
            - name: "SKIP_CERTIFICATE_VALIDATION"
              value: "true"
    # replication: allows to configure replication
    # Replication CRDs must be installed before installing driver
    - name: replication
      # enabled: Enable/Disable replication feature
      # Allowed values:
      #   true: enable replication feature(install dell-csi-replicator sidecar)
      #   false: disable replication feature(do not install dell-csi-replicator sidecar)
      # Default value: false
      enabled: false
      metrics:
        enabled: false
        port: 8445
        tlsCertSecret: ""
        collection:
          interval: "30s"
        serviceMonitor:
          enabled: false
          interval: "30s"
          scrapeTimeout: ""
          insecureSkipVerify: false
        prometheusRule:
          enabled: true
          rpoThresholdSeconds: 300
      components:
        - name: dell-csi-replicator
          envs:
            # replicationPrefix: prefix to prepend to storage classes parameters
            # Allowed values: string
            # Default value: replication.storage.dell.com
            - name: "X_CSI_REPLICATION_PREFIX"
              value: "replication.storage.dell.com"
            # replicationContextPrefix: prefix to use for naming of resources created by replication feature
            # Allowed values: string
            # Default value: powerstore
            - name: "X_CSI_REPLICATION_CONTEXT_PREFIX"
              value: "powerscale"
        - name: dell-replication-controller-manager
          envs:
            # Replication log level
            # Allowed values: "error", "warn"/"warning", "info", "debug"
            # Default value: "info"
            - name: "REPLICATION_CTRL_LOG_LEVEL"
              value: "info"
            # Replication log format
            # Allowed values: "text", "json"
            # Default value: "json"
            - name: "REPLICATION_CTRL_LOG_FORMAT"
              value: "json"
            # replicas: Defines number of controller replicas
            # Allowed values: int
            # Default value: 1
            - name: "REPLICATION_CTRL_REPLICAS"
              value: "1"
            # retryIntervalMin: Initial retry interval of failed reconcile request.
            # It doubles with each failure, upto retry-interval-max
            # Allowed values: time
            - name: "RETRY_INTERVAL_MIN"
              value: "1s"
            # RETRY_INTERVAL_MAX: Maximum retry interval of failed reconcile request
            # Allowed values: time
            - name: "RETRY_INTERVAL_MAX"
              value: "5m"
            # DISABLE_PVC_REMAP: Disable PVC remapping for replication in single cluster configuration
            # Allowed values:
            #   true: Disable replication feature(install dell-csi-replicator sidecar)
            #   false: disable replication feature(do not install dell-csi-replicator sidecar)
            # Default value: false
            - name: "DISABLE_PVC_REMAP"
              value: "false"
            # REPLICATION_ALLOW_PVC_CREATION_ON_TARGET: It Creates PVC on target cluster using replicated PV.
            # Allowed values:
            #   true: It creates a PVC on target cluster against replicated PV
            #   false: simply updates claimref on replicated PV on target cluster without actually creating a PVC
            # Default value: false
            - name: "REPLICATION_ALLOW_PVC_CREATION_ON_TARGET"
              value: "false"
    # observability: allows to configure observability
    - name: observability
      # enabled: Enable/Disable observability
      # Default value: false
      enabled: false
      components:
        - name: otel-collector
          # enabled: Enable/Disable OpenTelemetry Collector
          # Default value: false
          enabled: false
          # certificate: base64-encoded certificate for cert/private-key pair -- add cert here to use custom certificates
          #  for self-signed certs, leave empty string
          # Allowed values: string
          certificate: ""
          # privateKey: base64-encoded private key for cert/private-key pair -- add private key here to use custom certificates
          #  for self-signed certs, leave empty string
          # Allowed values: string
          privateKey: ""
        - name: cert-manager
          # enabled: Enable/Disable cert-manager
          # Allowed values:
          #   true: enable deployment of cert-manager
          #   false: disable deployment of cert-manager only if it's already deployed
          # Default value: false
          enabled: false
        - name: metrics-powerscale
          # enabled: Enable/Disable PowerScale metrics
          # Default value: false
          enabled: false
          envs:
            # POWERSCALE_MAX_CONCURRENT_QUERIES: set the default max concurrent queries to PowerScale
            # Allowed values: int
            # Default value: 10
            - name: "POWERSCALE_MAX_CONCURRENT_QUERIES"
              value: "10"
            # POWERSCALE_TOPOLOGY_METRICS_ENABLED: enable/disable collection of topology metrics
            # Allowed values: ture, false
            # Default value: true
            - name: "POWERSCALE_TOPOLOGY_METRICS_ENABLED"
              value: "true"
            # POWERSCALE_TOPOLOGY_METRICS_POLL_FREQUENCY: set polling frequency to get topology metrics
            # Allowed values: int
            # Default value: 30
            - name: "POWERSCALE_TOPOLOGY_METRICS_POLL_FREQUENCY"
              value: "30"
            # POWERSCALE_CAPACITY_METRICS_ENABLED: enable/disable collection of capacity metrics
            # Allowed values: ture, false
            # Default value: true
            - name: "POWERSCALE_CAPACITY_METRICS_ENABLED"
              value: "true"
            # POWERSCALE_PERFORMANCE_METRICS_ENABLED: enable/disable collection of performance metrics
            # Allowed values: ture, false
            # Default value: true
            - name: "POWERSCALE_PERFORMANCE_METRICS_ENABLED"
              value: "true"
            # POWERSCALE_CLUSTER_CAPACITY_POLL_FREQUENCY: set polling frequency to get cluster capacity metrics data
            # Allowed values: int
            # Default value: 30
            - name: "POWERSCALE_CLUSTER_CAPACITY_POLL_FREQUENCY"
              value: "30"
            # POWERSCALE_CLUSTER_PERFORMANCE_POLL_FREQUENCY: set polling frequency to get cluster performance metrics data
            # Allowed values: int
            # Default value: 20
            - name: "POWERSCALE_CLUSTER_PERFORMANCE_POLL_FREQUENCY"
              value: "20"
            # POWERSCALE_QUOTA_CAPACITY_POLL_FREQUENCY: set polling frequency to get Quota capacity metrics data
            # Allowed values: int
            # Default value: 20
            - name: "POWERSCALE_QUOTA_CAPACITY_POLL_FREQUENCY"
              value: "30"
            # ISICLIENT_INSECURE: set true/false to skip/verify OneFS API server's certificates
            # Allowed values: ture, false
            # Default value: true
            - name: "ISICLIENT_INSECURE"
              value: "true"
            # ISICLIENT_AUTH_TYPE: set 0/1 to enables session-based/basic Authentication
            # Allowed values: ture, false
            # Default value: true
            - name: "ISICLIENT_AUTH_TYPE"
              value: "1"
            # ISICLIENT_VERBOSE: set 0/1/2 decide High/Medium/Low content of the OneFS REST API message should be logged in debug level logs
            # Allowed values: 0,1,2
            # Default value: 0
            - name: "ISICLIENT_VERBOSE"
              value: "0"
            # PowerScale metrics log level
            # Valid values: trace, debug, info, warn, error, fatal, panic
            # Default value: "info"
            - name: "POWERSCALE_LOG_LEVEL"
              value: "info"
            # PowerScale Metrics Output logs in the specified format
            # Valid values: text, json
            # Default value: "json"
            - name: "POWERSCALE_LOG_FORMAT"
              value: "json"
            # Otel collector address
            # Allowed values: String
            # Default value: "otel-collector:55680"
            - name: "COLLECTOR_ADDRESS"
              value: "otel-collector:55680"
      # metrics: Configure observability self-metrics endpoint
      metrics:
        # enabled: Enable/Disable observability self-metrics endpoint
        # Allowed values: true, false
        # Default value: false
        enabled: false
        # port: Port used by observability self-metrics endpoint
        # Allowed values: 1-65535
        # Default value: 8443
        port: 8443
        # tlsCertSecret: Name of secret containing TLS certificate and key for observability self-metrics
        # Allowed values: Kubernetes secret name, empty string
        # Default value: ""
        tlsCertSecret: ""
        # serviceMonitor: Configure ServiceMonitor for observability self-metrics
        serviceMonitor:
          # enabled: Enable/Disable ServiceMonitor creation for observability self-metrics
          # Allowed values: true, false
          # Default value: false
          enabled: false
          # interval: Prometheus scrape interval for observability self-metrics
          # Allowed values: duration string (for example: 15s, 30s, 1m)
          # Default value: "30s"
          interval: "30s"
          # scrapeTimeout: Prometheus scrape timeout for observability self-metrics
          # Allowed values: duration string, empty string
          # Default value: ""
          scrapeTimeout: ""
          # insecureSkipVerify: Skip TLS certificate verification while scraping observability self-metrics
          # Allowed values: true, false
          # Default value: false
          insecureSkipVerify: false
        # prometheusRule: Configure Prometheus Operator PrometheusRule for observability alerts
        prometheusRule:
          # enabled: Enable/Disable PrometheusRule creation for observability alerts
          # Allowed values: true, false
          # Default value: false
          enabled: false
    - name: resiliency
      # enabled: Enable/Disable Resiliency feature
      # Allowed values:
      #   true: enable Resiliency feature(deploy podmon sidecar)
      #   false: disable Resiliency feature(do not deploy podmon sidecar)
      # Default value: false
      enabled: false
      components:
        - name: podmon-controller
          imagePullPolicy: IfNotPresent
          args:
            - "--labelvalue=csi-isilon"
            - "--arrayConnectivityPollRate=60"
            - "--skipArrayConnectionValidation=false"
            - "--driverPodLabelValue=dell-storage"
            - "--ignoreVolumelessPods=false"
            - "--arrayConnectivityConnectionLossThreshold=3"
            # Below 4 args should not be modified.
            - "--csisock=unix:/var/run/csi/csi.sock"
            - "--mode=controller"
            - "--driverPath=csi-isilon.dellemc.com"
            - "--driver-config-params=/csi-isilon-config-params/driver-config-params.yaml"
        - name: podmon-node
          imagePullPolicy: IfNotPresent
          envs:
            # podmonAPIPort: Defines the port to be used within the kubernetes cluster
            # Allowed values: Any valid and free port (string)
            # Default value: 8083
            - name: "X_CSI_PODMON_API_PORT"
              value: "8083"
              # podmonAPIToken: Shared secret token for authenticating podmon API requests
              # Security note: podmon API uses HTTP; use this only on trusted cluster-internal networks.
              # Example (literal value):
              # - name: "X_CSI_PODMON_API_TOKEN"
              #   value: "<strong-random-token>"
              # Note: valueFrom.secretKeyRef is not currently supported for this token
          args:
            - "--labelvalue=csi-isilon"
            - "--arrayConnectivityPollRate=60"
            - "--leaderelection=false"
            - "--driverPodLabelValue=dell-storage"
            - "--ignoreVolumelessPods=false"
            # Below 4 args should not be modified.
            - "--csisock=unix:/var/lib/kubelet/plugins/csi-isilon/csi_sock"
            - "--mode=node"
            - "--driverPath=csi-isilon.dellemc.com"
            - "--driver-config-params=/csi-isilon-config-params/driver-config-params.yaml"
      # metrics: Configure resiliency module metrics endpoint
      # The operator automatically creates Service/ServiceMonitor/PodMonitor resources for podmon metrics.
      metrics:
        # enabled: Enable/Disable resiliency module metrics endpoint
        # Allowed values: true, false
        # Default value: false
        enabled: false
        # port: Port used by resiliency module metrics endpoint
        # Allowed values: 1-65535
        # Default value: 8444
        port: 8444
        # tlsCertSecret: Name of a Kubernetes TLS Secret (tls.crt / tls.key) used to serve metrics over HTTPS.
        # When set the operator mounts the secret and configures HTTPS automatically.
        # Leave unset to serve metrics over plain HTTP.
        tlsCertSecret: ""
        # collection: Controls metrics collection cadence inside the resiliency module.
        collection:
          # interval: Interval at which metrics are collected
          # Allowed values: Go duration string (e.g., 30s, 1m)
          # Default value: 30s
          interval: 30s
        # serviceMonitor: Creates a Prometheus Operator ServiceMonitor targeting the controller pods.
        serviceMonitor:
          # enabled: Enable/Disable ServiceMonitor for resiliency metrics
          # Allowed values: true, false
          # Default value: false
          enabled: false
          # interval: Interval at which metrics should be scraped
          # Allowed values: Go duration string (e.g., 30s, 1m)
          # Default value: 30s
          interval: 30s
          # scrapeTimeout: Timeout after which the scrape is ended
          # Allowed values: Go duration string (e.g., 10s)
          # Default value: ""
          scrapeTimeout: ""
          # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
          # Allowed values: true, false
          # Default value: false
          insecureSkipVerify: false
        # podMonitor: Creates a Prometheus Operator PodMonitor targeting the node pods.
        podMonitor:
          # enabled: Enable/Disable PodMonitor for resiliency metrics
          # Allowed values: true, false
          # Default value: false
          enabled: false
          # interval: Interval at which metrics should be scraped
          # Allowed values: Go duration string (e.g., 30s, 1m)
          # Default value: 30s
          interval: 30s
          # scrapeTimeout: Timeout after which the scrape is ended
          # Allowed values: Go duration string (e.g., 10s)
          # Default value: ""
          scrapeTimeout: ""
          # insecureSkipVerify: Skip TLS verification when scraping metrics endpoint
          # Allowed values: true, false
          # Default value: false
          insecureSkipVerify: false
        # prometheusRule: Creates a Prometheus Operator PrometheusRule containing resiliency alert rules.
        prometheusRule:
          # enabled: Enable/Disable PrometheusRule creation for resiliency alerts
          # Allowed values: true, false
          # Default value: true
          enabled: true
          # connectivitySuccessRatio: Minimum percentage of successful array connectivity checks
          # below which the CSMResiliencyConnectivityLost alert fires.
          # Allowed values: 0-100
          # Default value: 90
          connectivitySuccessRatio: 90
