apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
      annotations:
        storage.dell.com/CSMVersion: v1.18.0
    spec:
      serviceAccountName: manager-service-account
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - command:
            - /manager
          args:
            - --leader-elect
            - --metrics-bind-address=:8443
          image: controller:latest
          imagePullPolicy: Always
          name: manager
          env:
            - name: FAILURE_GRACE_PERIOD
              value: "10m"
            - name: REFRESH_INTERVAL_MINUTES
              value: "60"
            - value: quay.io/dell/container-storage-modules/dell-csm-operator:v1.13.0
              name: RELATED_IMAGE_dell-csm-operator
            - value: quay.io/dell/container-storage-modules/csi-isilon:v2.18.0
              name: RELATED_IMAGE_csi-isilon
            - value: quay.io/dell/container-storage-modules/csi-powermax:v2.18.0
              name: RELATED_IMAGE_csi-powermax
            - value: quay.io/dell/container-storage-modules/csipowermax-reverseproxy:v2.17.0
              name: RELATED_IMAGE_csipowermax-reverseproxy
            - value: quay.io/dell/container-storage-modules/csi-powerstore:v2.18.0
              name: RELATED_IMAGE_csi-powerstore
            - value: quay.io/dell/container-storage-modules/csi-unity:v2.18.0
              name: RELATED_IMAGE_csi-unity
            - value: quay.io/dell/container-storage-modules/csi-vxflexos:v2.18.0
              name: RELATED_IMAGE_csi-vxflexos
            - value: quay.io/dell/container-storage-modules/cosi:v1.2.0
              name: RELATED_IMAGE_cosi
            - value: quay.io/dell/storage/powerflex/sdc:5.1.0.2
              name: RELATED_IMAGE_sdc
            - name: RELATED_IMAGE_karavi-authorization-proxy
              value: quay.io/dell/container-storage-modules/csm-authorization-sidecar:v2.6.0
            - name: RELATED_IMAGE_csm-authorization-proxy
              value: quay.io/dell/container-storage-modules/csm-authorization-proxy:v2.6.0
            - name: RELATED_IMAGE_csm-authorization-tenant
              value: quay.io/dell/container-storage-modules/csm-authorization-tenant:v2.6.0
            - name: RELATED_IMAGE_csm-authorization-role
              value: quay.io/dell/container-storage-modules/csm-authorization-role:v2.6.0
            - name: RELATED_IMAGE_csm-authorization-storage
              value: quay.io/dell/container-storage-modules/csm-authorization-storage:v2.6.0
            - name: RELATED_IMAGE_csm-authorization-controller
              value: quay.io/dell/container-storage-modules/csm-authorization-controller:v2.6.0
            - value: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.16.0
              name: RELATED_IMAGE_dell-csi-replicator
            - value: quay.io/dell/container-storage-modules/dell-replication-controller:v1.16.0
              name: RELATED_IMAGE_dell-replication-controller-manager
            - value: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.160.0
              name: RELATED_IMAGE_otel-collector
            - value: quay.io/dell/container-storage-modules/csm-metrics-powerscale:v1.13.0
              name: RELATED_IMAGE_metrics-powerscale
            - value: quay.io/dell/container-storage-modules/csm-metrics-powermax:v1.11.0
              name: RELATED_IMAGE_metrics-powermax
            - value: quay.io/dell/container-storage-modules/csm-metrics-powerflex:v1.16.0
              name: RELATED_IMAGE_metrics-powerflex
            - value: quay.io/dell/container-storage-modules/csm-metrics-powerstore:v1.16.0
              name: RELATED_IMAGE_metrics-powerstore
            - value: quay.io/dell/container-storage-modules/podmon:v1.17.0
              name: RELATED_IMAGE_podmon-node
            - value: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
              name: RELATED_IMAGE_attacher
            - value: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
              name: RELATED_IMAGE_provisioner
            - value: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
              name: RELATED_IMAGE_snapshotter
            - value: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0
              name: RELATED_IMAGE_registrar
            - value: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
              name: RELATED_IMAGE_resizer
            - value: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0
              name: RELATED_IMAGE_externalhealthmonitorcontroller
            - value: quay.io/dell/container-storage-modules/csi-metadata-retriever:v1.15.0
              name: RELATED_IMAGE_metadataretriever
            - value: quay.io/nginx/nginx-unprivileged:1.30.4
              name: RELATED_IMAGE_nginx
            - value: docker.io/rediscommander/redis-commander:latest
              name: RELATED_IMAGE_redis-commander
            - value: docker.io/openpolicyagent/opa:0.70.0
              name: RELATED_IMAGE_opa
            - value: docker.io/openpolicyagent/kube-mgmt:11.0.12
              name: RELATED_IMAGE_kube-mgmt
            - value: gcr.io/k8s-staging-sig-storage/objectstorage-sidecar:release-0.2
              name: RELATED_IMAGE_objectstorage-provisioner-sidecar
            - name: RELATED_IMAGE_cert-manager-cainjector
              value: quay.io/jetstack/cert-manager-cainjector:v1.21.1
            - name: RELATED_IMAGE_cert-manager-controller
              value: quay.io/jetstack/cert-manager-controller:v1.21.1
            - name: RELATED_IMAGE_cert-manager-webhook
              value: quay.io/jetstack/cert-manager-webhook:v1.21.1
            - name: RELATED_IMAGE_redis
              value: docker.io/library/redis:8.10.1-alpine
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 192Mi
      terminationGracePeriodSeconds: 10
