apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: isilon-mtls
provisioner: csi-isilon.dellemc.com
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  AccessZone: System
  IsiPath: /ifs/data

  # Optional node network CIDR used to authorize node IPs when PowerScale
  # cannot resolve Kubernetes node hostnames.
  # Set POWERSCALE_AZ_NETWORK when running in such an environment.
  AzNetwork: "${POWERSCALE_AZ_NETWORK}"

  # SmartConnect FQDN for mTLS certificate validation
  # Use environment variable POWERSCALE_MTLS_FQDN if set, otherwise use the array endpoint
  # The FQDN must be resolvable and match the certificate SAN
  SmartConnectZoneFQDN: "${POWERSCALE_MTLS_FQDN}"

  # NFS transport security mode
  NFSTransportSecurity: "mtls"

# Mount options required for mTLS over NFS
mountOptions:
  - "xprtsec=mtls"
  - "vers=4.1"
  - "hard"
  - "timeo=600"
  - "retrans=2"

volumeBindingMode: Immediate
