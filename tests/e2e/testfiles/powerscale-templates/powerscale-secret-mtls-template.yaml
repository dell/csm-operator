isilonClusters:
  - clusterName: "REPLACE_CLUSTERNAME"
    username: "REPLACE_USER"
    password: "REPLACE_PASS"
    isDefault: true
    endpoint: "REPLACE_ENDPOINT"
    skipCertificateValidation: true
    endpointPort: "REPLACE_PORT"
    # mTLS NFS Transport Configuration (cluster-level - middle precedence)
    # nfsMountFQDN: Specify the default FQDN for this cluster's NFS mount target.
    # StorageClass SmartConnectZoneFQDN takes precedence; this value overrides the global
    # X_CSI_ISI_NFS_MOUNT_FQDN fallback. NFSTransportSecurity remains StorageClass-scoped.
    # Allowed values: a valid FQDN (for example, "smartconnect.isilon.example.com")
    # Optional: true; default: None
    # Example: nfsMountFQDN: "smartconnect.isilon.example.com"
    # Use environment variable POWERSCALE_MTLS_FQDN if set
    nfsMountFQDN: "${POWERSCALE_MTLS_FQDN}"
