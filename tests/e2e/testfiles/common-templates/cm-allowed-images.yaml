# csm-image-allowlist.yaml -- operator-managed image/registry allowlist.
#
# This ConfigMap controls which container image registries are permitted
# in ContainerStorageModule CRs. The operator validates all user-supplied
# image overrides (spec.driver.common.image, sideCars[*].image,
# initContainers[*].image, modules[*].components[*].image) and
# spec.customRegistry against this list during PreChecks, before any
# privileged workload (DaemonSet, ClusterRoleBinding) is created.
#
# If this ConfigMap is not deployed, the operator uses a built-in default
# allowlist that covers Dell and official CSI sidecar registries.
#
# To add a private registry (e.g., for air-gapped deployments), add it
# to the allowedRegistries list below and apply this ConfigMap to the
# operator namespace (dell-csm-operator):
#
#   kubectl apply -f csm-image-allowlist.yaml -n dell-csm-operator
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: csm-image-allowlist
  namespace: dell-csm-operator
data:
  allowlist.yaml: |
    allowedRegistries:
      # Dell CSM images
      - "quay.io/dell"
      - "quay.io/dell/storage"
      - "quay.io/csiaddons"
      # Kubernetes CSI sidecar images
      - "registry.k8s.io/sig-storage"
      # OpenTelemetry collector
      - "ghcr.io/open-telemetry"
      # cert-manager
      - "quay.io/jetstack"
      # OPA and kube-mgmt
      - "docker.io/openpolicyagent"
      # Redis commander
      - "docker.io/rediscommander"
      # Redis
      - "docker.io/library/redis"
      # nginx
      - "quay.io/nginx"
      # COSI sidecar
      - "gcr.io/k8s-staging-sig-storage"
      # Red Hat Connect
      - "registry.connect.redhat.com/dell-emc"
      # Add your private registries below:
      - "csm.artifactory.cec.lab.emc.com/csm-users"
