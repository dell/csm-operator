apiVersion: v1
kind: Pod
metadata:
  name: metro-verify-pod-e2e
  namespace: REPLACE_NAMESPACE
spec:
  containers:
    - name: verify-container
      image: busybox:1.36.1
      command: ["sleep", "3600"]
      volumeMounts:
        - name: verify-volume
          mountPath: /data
  volumes:
    - name: verify-volume
      persistentVolumeClaim:
        claimName: restored-metro-pvc-e2e
  restartPolicy: Never
