apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restored-nonmetro-pvc-e2e
  namespace: REPLACE_NAMESPACE
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
  storageClassName: op-e2e-powerstore
  dataSource:
    name: metro-snapshot-e2e
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
