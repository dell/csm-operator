apiVersion: storage.dell.com/v1
kind: ContainerStorageModule
metadata:
  name: powermax
  namespace: ${E2E_NS_POWERMAX}
spec:
  version: ${CSM_VERSION_LATEST}
  driver:
    csiDriverType: "powermax"
    authSecret: powermax-creds
    replicas: 2
    dnsPolicy: ClusterFirstWithHostNet
    forceRemoveDriver: true
    common:
      imagePullPolicy: Always
      envs:
        - name: X_CSI_POWERMAX_SKIP_CERTIFICATE_VALIDATION
          value: "true"
  modules:
    - name: csireverseproxy
      components:
        - name: csipowermax-reverseproxy
          envs:
            - name: X_CSI_REVPROXY_TLS_SECRET
              value: "csirevproxy-tls-secret"
            - name: X_CSI_CONFIG_MAP_NAME
              value: "powermax-reverseproxy-config"
    - name: replication
      enabled: true
      metrics:
        enabled: true
        port: 8445
        tlsCertSecret: "powermax-replication-metrics-tls"
        collection:
          interval: "30s"
        serviceMonitor:
          enabled: true
          interval: "30s"
          scrapeTimeout: ""
          insecureSkipVerify: false
        podMonitor:
          enabled: true
          interval: "30s"
          scrapeTimeout: ""
          insecureSkipVerify: false
      components:
        - name: dell-csi-replicator
          envs:
            - name: "X_CSI_REPLICATION_PREFIX"
              value: "replication.storage.dell.com"
            - name: "X_CSI_REPLICATION_CONTEXT_PREFIX"
              value: "powermax"
        - name: dell-replication-controller-manager
          envs:
            - name: "REPLICATION_CTRL_LOG_LEVEL"
              value: "debug"
            - name: "REPLICATION_CTRL_REPLICAS"
              value: "1"
            - name: "RETRY_INTERVAL_MIN"
              value: "1s"
            - name: "RETRY_INTERVAL_MAX"
              value: "5m"
            - name: "DISABLE_PVC_REMAP"
              value: "false"
            - name: "REPLICATION_ALLOW_PVC_CREATION_ON_TARGET"
              value: "false"
