    - "Delete Authorization CRDs [2]"

- scenario: "Install Authorization Proxy Server V2 with PrometheusRule lifecycle"
  paths:
    - "testfiles/authorization-templates/storage_csm_authorization_v2_proxy_server_prometheusrule.yaml"
    - "../../operatorconfig/moduleconfig/authorization/{authorization-proxy-server}/authorization-crds.yaml"
    - "testfiles/authorization-templates/storage_csm_authorization_v2_template_k8s_secret.yaml"
  tags:
    - "authorizationproxyserver"
    - "prometheusrule"
    - "auth-proxy"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    - "Install Authorization CRDs [2]"
    - "Create [authorization-proxy-server] prerequisites from CR [1]"
    - "Create Secret from file [testfiles/authorization-templates/storage_csm_authorization_k8s_secret.yaml]
      name [secret-1] in namespace [${E2E_NS_AUTH}] for [powerflex]"
    - "Apply custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [authorization-proxy-server] module from CR [1] is installed"
    - "Validate [authorization-proxy-server] Authorization PrometheusRule is created
      for resource [1]"
    # Disable PrometheusRule while keeping metrics enabled; rule must be deleted
    - "Disable [authorization-proxy-server] PrometheusRule in CR [1]"
    - "Validate custom resource [1]"
    - "Validate [authorization-proxy-server] Authorization PrometheusRule is absent
      for resource [1]"
    # Re-enable PrometheusRule; operator must recreate the rule
    - "Enable [authorization-proxy-server] PrometheusRule in CR [1]"
    - "Validate custom resource [1]"
    - "Validate [authorization-proxy-server] Authorization PrometheusRule is created
      for resource [1]"
    # Disable metrics entirely; operator must delete the PrometheusRule even though prometheusRule.enabled is true
    - "Disable [authorization-proxy-server] metrics in CR [1]"
    - "Validate custom resource [1]"
    - "Validate [authorization-proxy-server] Authorization PrometheusRule is absent
      for resource [1]"
    # Re-enable metrics and PrometheusRule; operator must recreate the rule
    - "Enable [authorization-proxy-server] metrics in CR [1]"
    - "Enable [authorization-proxy-server] PrometheusRule in CR [1]"
    - "Validate custom resource [1]"
    - "Validate [authorization-proxy-server] Authorization PrometheusRule is created
      for resource [1]"
    # Disable the authorization-proxy-server module entirely; rule and pods are removed
    - "Disable [authorization-proxy-server] module from CR [1]"
    - "Validate custom resource [1]"
    - "Validate [authorization-proxy-server] Authorization PrometheusRule is absent
      for resource [1]"
    - "Delete Authorization CRs for [powerflex]"
    - "Delete custom resource [1]"
    - "Validate [authorization] module pods from CR [1] is not installed"
    - "Delete Authorization CRDs [2]"

