      name [vxflexos-config] in namespace [${E2E_NS_POWERFLEX}] for [powerflex]"
    - "If POWERFLEX_SDC_SFTP_REPO_ENABLED: Configure Powerflex SFTP from template
      [testfiles/powerflex-templates/powerflex-sftp-secret-private.crt] private-secret
      [sdcsftprepo-private-secret] public-secret [sdcsftprepo-public-secret] in namespace
      [${E2E_NS_POWERFLEX}] for [powerflex] CR [1]"
    - "Apply custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [powerstore] driver from CR [1] is installed"
    # Validate initial defaults
    - "Validate [common] env [X_CSI_FS_CHECK_ENABLED] is [] in CSM CR for resource
      [1]"
    - "Validate [common] env [X_CSI_FS_CHECK_MODE] is [] in CSM CR for resource [1]"
    - "Validate [node] [driver] env [X_CSI_FS_CHECK_ENABLED] is [false] in driver
      for resource [1]"
    - "Validate [node] [driver] env [X_CSI_FS_CHECK_MODE] is [checkOnly] in driver
      for resource [1]"
