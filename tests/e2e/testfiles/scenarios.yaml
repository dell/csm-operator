- scenario: "Install PowerScale Driver(Standalone), Enable/Disable Metrics"
  paths:
    - "testfiles/storage_csm_powerscale_standalone.yaml"
  tags:
    - "powerscale"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    - "Create Secret with template [testfiles/powerscale-templates/powerscale-secret-template.yaml]
      name [csm-creds] in namespace [${E2E_NS_POWERSCALE}] for [powerscale]"
    - "Apply custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [powerscale] driver from CR [1] is installed"
    # standalone YAML deploys with metrics.enabled: true and prometheusRule.enabled: true;
    # verify the operator created the PrometheusRule on first reconciliation
    - "Validate [powerscale] driver metrics PrometheusRule is created for resource
      [1]"
    - "Enable [metrics] in CR [1]"
    - "Validate [metrics] endpoints are exposed in driver for resource [1]"
    # Disable PrometheusRule while keeping metrics enabled; rule must be deleted
    - "Disable [prometheusRule] in CR [1]"
    - "Validate [powerscale] driver metrics PrometheusRule is absent for resource
      [1]"
    # Re-enable PrometheusRule; operator must recreate the rule
    - "Enable [prometheusRule] in CR [1]"
    - "Validate [powerscale] driver metrics PrometheusRule is created for resource
      [1]"
    # Disable metrics entirely; operator must delete the PrometheusRule even though prometheusRule.enabled is true
    - "Disable [metrics] in CR [1]"
    - "Validate [powerscale] driver metrics PrometheusRule is absent for resource
      [1]"
    - "Validate [powerscale] driver from CR [1] is installed"
    # cleanup
    - "Enable forceRemoveDriver on CR [1]"
    - "Delete custom resource [1]"
    - "Validate [powerscale] driver from CR [1] is not installed"

