    - "testfiles/storage_csm_powerscale_mtls.yaml"
  tags:
    - "powerscale"
    - "mtls"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    - "Create StorageClass with template [testfiles/powerscale-templates/powerscale-storageclass-mtls-no-fqdn-template.yaml] for [powerscale]"
    - "Create Secret with template [testfiles/powerscale-templates/powerscale-secret-mtls-secret-sentinel-template.yaml] name [isilon-creds] in namespace [${E2E_NS_POWERSCALE}] for [powerscale]"
    - "Set [common] env [X_CSI_ISI_NFS_MOUNT_FQDN] to [env.smartconnect.example.com] in resource [1]"
    - "Apply custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [powerscale] driver from CR [1] is installed"
    - "Create resource with template [testfiles/powerscale-templates/powerscale-pvc-mtls-secret-fallback-template.yaml] in namespace [${E2E_NS_POWERSCALE}]"
    - "Validate PVC [pscale-pvc-mtls-secret-fallback] is bound in namespace [${E2E_NS_POWERSCALE}]"
    - "Validate FQDN fallback from [Secret] for PVC [pscale-pvc-mtls-secret-fallback] expected [secret.smartconnect.example.com] in namespace [${E2E_NS_POWERSCALE}]"
    - "Delete resource [testfiles/powerscale-templates/powerscale-pvc-mtls-secret-fallback-template.yaml] in namespace [${E2E_NS_POWERSCALE}]"
    - "Enable forceRemoveDriver on CR [1]"
    - "Delete custom resource [1]"
    - "Validate [powerscale] driver from CR [1] is not installed"

