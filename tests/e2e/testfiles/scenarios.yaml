- scenario: "PowerScale mTLS - Verify FQDN Fallback from Secret/Environment"
  paths:
    - "testfiles/storage_csm_powerscale_mtls.yaml"
  tags:
    - "powerscale"
    - "mtls"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    # Use StorageClass WITHOUT SmartConnectZoneFQDN to test fallback
    - "Create StorageClass with template [testfiles/powerscale-templates/powerscale-storageclass-mtls-no-fqdn-template.yaml] for [powerscale]"
    # Secret has nfsMountFQDN set, environment has X_CSI_ISI_NFS_MOUNT_FQDN set
    # Driver should resolve FQDN from Secret or environment since StorageClass omits it
    - "Create Secret with template [testfiles/powerscale-templates/powerscale-secret-mtls-template.yaml] name [isilon-creds] in namespace [${E2E_NS_POWERSCALE}] for [powerscale]"
    - "Apply custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [powerscale] driver from CR [1] is installed"
    # Create PVC/Pod using the no-FQDN StorageClass
    - "Create resource with template [testfiles/powerscale-templates/powerscale-pod-mtls-no-fqdn-template.yaml] in namespace [${E2E_NS_POWERSCALE}]"
    - "Validate PVC [pscale-pvc-mtls-no-fqdn] is bound in namespace [${E2E_NS_POWERSCALE}]"
    - "Validate Pod [pscale-pod-mtls-no-fqdn] is running in namespace [${E2E_NS_POWERSCALE}]"
    # Verify FQDN was resolved from Secret/environment and persisted in PV
    - "Validate FQDN fallback precedence for Pod [pscale-pod-mtls-no-fqdn] in namespace [${E2E_NS_POWERSCALE}]"
    # Cleanup
    - "Delete resource [testfiles/powerscale-templates/powerscale-pod-mtls-no-fqdn-template.yaml] in namespace [${E2E_NS_POWERSCALE}]"
    - "Enable forceRemoveDriver on CR [1]"
    - "Delete custom resource [1]"
    - "Validate [powerscale] driver from CR [1] is not installed"

