# # List of E2E Tests Scenarios

- scenario: "Install Authorization CRDs for V2"
  paths:
    - "../../operatorconfig/moduleconfig/authorization/{authorization-proxy-server}/authorization-crds.yaml"
  tags:
    - "authorizationproxyserver"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    - "Install Authorization CRDs [1]"
    - "Validate [csmroles] CRD for Authorization is installed"
    - "Validate [csmtenants] CRD for Authorization is installed"
    - "Validate [storages] CRD for Authorization is installed"
    - "Delete Authorization CRDs [1]"

- scenario: "Install Authorization Proxy Server V2 (Conjur)"
  paths:
    - "testfiles/authorization-templates/storage_csm_authorization_v2_proxy_server_conjur.yaml"
    - "../../operatorconfig/moduleconfig/authorization/{authorization-proxy-server}/authorization-crds.yaml"
    - "testfiles/authorization-templates/storage_csm_authorization_v2_template_conjur.yaml"
  tags:
    - "authorizationproxyserver"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    - "Install Authorization CRDs [2]"
    - "Create [authorization-proxy-server] prerequisites from CR [1]"
    - "Create resource with template [testfiles/authorization-templates/storage_csm_authorization_secret_provider_class_conjur.yaml]
      in namespace [${E2E_NS_AUTH}]"
    - "Apply Authorization with Conjur custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [authorization-proxy-server] module from CR [1] is installed"
    - "Configure authorization-proxy-server with template [3] for [powerflex] for
      CR [1]"
