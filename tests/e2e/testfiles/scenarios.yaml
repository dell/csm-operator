- scenario: "PowerScale mTLS - Upgrade from Non-mTLS to mTLS"
  paths:
    - "testfiles/storage_csm_powerscale_non_mtls.yaml"
    - "testfiles/storage_csm_powerscale_mtls.yaml"
  tags:
    - "powerscale"
    - "mtls"
    - "upgrade"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    # Phase 1: Install driver without mTLS environment variables
    - "Create StorageClass with template [testfiles/powerscale-templates/powerscale-storageclass-template.yaml] for [powerscale]"
    - "Create Secret with template [testfiles/powerscale-templates/powerscale-secret-template.yaml] name [isilon-creds] in namespace [${E2E_NS_POWERSCALE}] for [powerscale]"
    - "Apply custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [powerscale] driver from CR [1] is installed"
    # Phase 2: Upgrade to mTLS by updating secret and applying mTLS CR
    - "Update Secret with template [testfiles/powerscale-templates/powerscale-secret-mtls-template.yaml] name [isilon-creds] in namespace [${E2E_NS_POWERSCALE}] for [powerscale]"
    - "Apply custom resource [2]"
    - "Validate custom resource [2]"
    - "Validate [powerscale] driver from CR [2] is installed"
    - "Validate mTLS environment variables are set for resource [2]"
    # Phase 3: Test mTLS mount after upgrade
    - "Create StorageClass with template [testfiles/powerscale-templates/powerscale-storageclass-mtls-template.yaml] for [powerscale]"
    - "Create resource with template [testfiles/powerscale-templates/powerscale-pod-mtls-template.yaml] in namespace [${E2E_NS_POWERSCALE}]"
    - "Validate PVC [pscale-pvc-mtls] is bound in namespace [${E2E_NS_POWERSCALE}]"
    - "Validate Pod [pscale-pod-mtls] is running in namespace [${E2E_NS_POWERSCALE}]"
    - "Validate mTLS mount in Pod [pscale-pod-mtls] in namespace [${E2E_NS_POWERSCALE}]"
    # Cleanup
    - "Delete resource [testfiles/powerscale-templates/powerscale-pod-mtls-template.yaml] in namespace [${E2E_NS_POWERSCALE}]"
    - "Enable forceRemoveDriver on CR [2]"
    - "Delete custom resource [2]"
    - "Validate [powerscale] driver from CR [2] is not installed"

