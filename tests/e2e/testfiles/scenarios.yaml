# Metro Snapshot Restore E2E Tests
# These tests require dual-array PowerStore metro configuration
# Environment variables required:
#   POWERSTORE_METRO_ENDPOINT, POWERSTORE_METRO_GLOBALID, POWERSTORE_METRO_USER,
#   POWERSTORE_METRO_PASS, POWERSTORE_METRO_REMOTE_SYSTEM

- scenario: "PowerStore Metro Snapshot Restore - Successful Restore"
  paths:
    - "testfiles/storage_csm_powerstore_metro_custom.yaml"
  tags:
    - "powerstore"
    - "metro-snapshot-restore"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    # Setup driver with metro configuration
    - "Create StorageClass with template [testfiles/powerstore-templates/powerstore-storageclass-template.yaml]
      for [powerstore]"
    - "Create StorageClass with template [testfiles/powerstore-templates/powerstore-storageclass-metro-template.yaml]
      for [powerstoreMetroStorage]"
    - "Create VolumeSnapshotClass with template [testfiles/powerstore-templates/powerstore-volumesnapshotclass-template.yaml]"
    - "Create Secret with template [testfiles/powerstore-templates/powerstore-secret-template-metro.yaml]
      name [powerstore-config] in namespace [${E2E_NS_POWERSTORE}] for [powerstoreMetro]"
    - "Apply custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [powerstore] driver from CR [1] is installed"
    # Create metro source PVC
    - "Create metro PVC with template [testfiles/powerstore-templates/metro-snapshot-restore/pvc-metro-source.yaml]
      in namespace [${E2E_NS_POWERSTORE}]"
    - "Wait for PVC [metro-source-pvc-e2e] to be bound in namespace [${E2E_NS_POWERSTORE}]"
    - "Validate PVC [metro-source-pvc-e2e] is metro in namespace [${E2E_NS_POWERSTORE}]"
    # Create test pod and write data
    - "Create pod with template [testfiles/powerstore-templates/metro-snapshot-restore/pod-test.yaml]
      in namespace [${E2E_NS_POWERSTORE}]"
    - "Wait for pod [metro-test-pod-e2e] to be running in namespace [${E2E_NS_POWERSTORE}]"
    - "Write data [metro-e2e-test-data] to file [/data/testfile.txt] in pod [metro-test-pod-e2e]
      namespace [${E2E_NS_POWERSTORE}]"
    - "Sync data in pod [metro-test-pod-e2e] namespace [${E2E_NS_POWERSTORE}]"
    # Delete any existing snapshot before creating a new one
    - "Delete VolumeSnapshot [metro-snapshot-e2e] in namespace [${E2E_NS_POWERSTORE}]"
    # Create snapshot
    - "Create VolumeSnapshot with template [testfiles/powerstore-templates/metro-snapshot-restore/snapshot-metro.yaml]
      in namespace [${E2E_NS_POWERSTORE}]"
    - "Wait for VolumeSnapshot [metro-snapshot-e2e] to be ready in namespace [${E2E_NS_POWERSTORE}]"
    # Delete test pod before restore
    - "Delete pod [metro-test-pod-e2e] in namespace [${E2E_NS_POWERSTORE}]"
    # Delete any existing restored PVC before creating a new one
    - "Delete PVC [restored-metro-pvc-e2e] in namespace [${E2E_NS_POWERSTORE}]"
    # Restore from snapshot with metro StorageClass
    - "Create metro PVC with template [testfiles/powerstore-templates/metro-snapshot-restore/pvc-restore-metro.yaml]
      in namespace [${E2E_NS_POWERSTORE}]"
    - "Wait for PVC [restored-metro-pvc-e2e] to be bound in namespace [${E2E_NS_POWERSTORE}]"
    - "Validate PVC [restored-metro-pvc-e2e] is metro in namespace [${E2E_NS_POWERSTORE}]"
    # Verify data integrity
    - "Create pod with template [testfiles/powerstore-templates/metro-snapshot-restore/pod-verify.yaml]
      in namespace [${E2E_NS_POWERSTORE}]"
    - "Wait for pod [metro-verify-pod-e2e] to be running in namespace [${E2E_NS_POWERSTORE}]"
    - "Verify data [metro-e2e-test-data] in file [/data/testfile.txt] in pod [metro-verify-pod-e2e]
      namespace [${E2E_NS_POWERSTORE}]"
    # Cleanup test resources
    - "Delete pod [metro-verify-pod-e2e] in namespace [${E2E_NS_POWERSTORE}]"
    - "Delete pod [metro-test-pod-e2e] in namespace [${E2E_NS_POWERSTORE}]"
    - "Delete PVC [restored-metro-pvc-e2e] in namespace [${E2E_NS_POWERSTORE}]"
    - "Delete VolumeSnapshot [metro-snapshot-e2e] in namespace [${E2E_NS_POWERSTORE}]"
    - "Delete PVC [metro-source-pvc-e2e] in namespace [${E2E_NS_POWERSTORE}]"
    - "Delete VolumeSnapshotClass [op-e2e-powerstore-snapshot]"
    # Cleanup driver
    - "Enable forceRemoveDriver on CR [1]"
    - "Delete custom resource [1]"
    - "Wait for pods to be deleted in namespace [${E2E_NS_POWERSTORE}]"
    - "Validate [powerstore] driver from CR [1] is not installed"

