# Multi-array zone support for PowerMax.
# The scenarios below extend the single-array-per-zone scenario above to cover
# multiple PowerMax arrays sharing one zone label. All worker nodes are labeled
# with a single zone/region pair (no alternation) because these scenarios validate
# capacity pooling *within* one zone, not node-to-zone distribution.

- scenario: "Install PowerMax Driver (Standalone) With Multi-Array Zone Pooling (separate
    Unisphere per array)"
  paths:
    - "testfiles/storage_csm_powermax_secret.yaml"
  tags:
    - "zoning"
    - "powermax"
    - "multiaz"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    - "Run [Apply Single Zone Node Labels]"
    - "Set up reverse proxy tls secret namespace [${E2E_NS_POWERMAX}]"
    - "Create Secret with template [testfiles/powermax-templates/powermax-multiaz-pool-secret-template.yaml]
      name [powermax-creds] in namespace [${E2E_NS_POWERMAX}] for [powermaxUseSecret]"
    - "Create resource with template [testfiles/powermax-templates/powermax-array-config.yaml]
      for [powermaxArrayConfig]"
    - "Apply custom resource [1]"
    - "Validate custom resource [1]"
    - "Validate [powermax] driver from CR [1] is installed"
    - "Run [Validate Node Labels]"
    - "Run [Validate Zone Pool Has 2 Arrays]"
    # PVC + Pod: prove volume provisioning works from the multi-array zone pool
    - "Create StorageClass with template [testfiles/powermax-templates/powermax-multiaz-zone-storageclass-template.yaml]
      for [powermax]"
    - "Run [Create PVC and Pod]"
    - "Run [Validate Volume Provisioned On Pool Array]"
    - "Run [Cleanup PVC Pod]"
    # cleanup
    - "Enable forceRemoveDriver on CR [1]"
    - "Delete custom resource [1]"
    - "Validate [powermax] driver from CR [1] is not installed"
    - "Run [Remove Node Labels]"
  customTest:
    - name: Apply Single Zone Node Labels
      run:
        - kubectl get nodes --show-labels
        - /bin/bash modify_zoning_labels.sh add zone.topology.kubernetes.io/zone=zoneA
        - /bin/bash modify_zoning_labels.sh add zone.topology.kubernetes.io/region=zoneC
        - kubectl get nodes --show-labels
    - name: Validate Node Labels
      run:
        - /bin/bash modify_zoning_labels.sh validate-zoning powermax
    - name: Validate Zone Pool Has 2 Arrays
      run:
        - /bin/bash validate_multiaz_zoning.sh pool-size powermax-creds ${E2E_NS_POWERMAX}
          zone.topology.kubernetes.io/zone 2
    - name: Create PVC and Pod
      run:
        - /bin/bash validate_multiaz_zoning.sh create-pvc-and-pod testfiles/powermax-templates/powermax-multiaz-pvc-template.yaml
          testfiles/powermax-templates/powermax-multiaz-pod-template.yaml ${E2E_NS_POWERMAX}
          180
    - name: Validate Volume Provisioned On Pool Array
      run:
        - /bin/bash validate_multiaz_zoning.sh validate-pvc-on-pool-array multiaz-zone-pool-pvc
          ${E2E_NS_POWERMAX} powermax-creds zone.topology.kubernetes.io/zone
    - name: Cleanup PVC Pod
      run:
        - /bin/bash validate_multiaz_zoning.sh cleanup-pvc-pod ${E2E_NS_POWERMAX}
    - name: Remove Node Labels
      run:
        - /bin/bash modify_zoning_labels.sh remove-all-zones
        - kubectl get nodes --show-labels

