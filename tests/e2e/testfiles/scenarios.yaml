# ---- Failure Grace Period tests ----

- scenario: "CR transitions to Failed state with bad image after grace period"
  paths:
    - "testfiles/storage_csm_powerscale.yaml"
  tags:
    - "powerscale"
    - "sanity"
  steps:
    - "Given an environment with k8s or openshift, and CSM operator installed"
    - "Create StorageClass with template [testfiles/powerscale-templates/powerscale-storageclass-template.yaml]
      for [powerscale]"
    - "Create Secret with template [testfiles/powerscale-templates/powerscale-secret-template.yaml]
      name [isilon-creds] in namespace [${E2E_NS_POWERSCALE}] for [powerscale]"
    # Ensure clean slate before operator restart
    - "Delete all CSM from namespace [${E2E_NS_POWERSCALE}]"
    # Set a short grace period so the test doesn't wait 10 minutes
    - "Set operator failure grace period to [1m]"
    # Inject a bad image via the ConfigMap to induce ErrImagePull / ImagePullBackOff
    - "Set ConfigMap image [isilon] to [quay.io/dell/container-storage-modules/csi-isilon:DOES-NOT-EXIST]"
    - "Apply custom resource [1]"
    # Wait for the grace period to elapse and verify the CR is marked Failed
    - "Validate custom resource [1] is failed"
    # cleanup: restore ConfigMap, grace period, force-remove the failed driver, delete the CR
    - "Restore ConfigMap"
    - "Set operator failure grace period to [10m]"
    - "Enable forceRemoveDriver on CR [1]"
    - "Delete custom resource [1]"
    - "Validate [powerscale] driver from CR [1] is not installed"

# ---- Rollback/Upgrade Integration Tests ----
# All scenarios use spec.version (no configVersion) with images resolved via configMap.
# Each driver has three scenarios: sequential upgrade (n-1→n), version skip (n-2→n),
# and auto-rollback (n-1→n with invalid image via ConfigMap override).

