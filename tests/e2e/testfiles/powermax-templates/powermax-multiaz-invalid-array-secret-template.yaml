#
# Negative case: one malformed array entry (missing
# primaryEndpoint/backupEndpoint) sharing a zone label with one valid array entry.
# The driver must reject only the malformed entry -- identifying its
# serial number -- while keeping the valid array operational for the zone.
storageArrays:
  - storageArrayId: "REPLACE_SYSTEMID"
    primaryEndpoint: "https://REPLACE_ENDPOINT"
    backupEndpoint: "https://REPLACE_ENDPOINT"
    labels:
      zone.topology.kubernetes.io/zone: zoneA
      zone.topology.kubernetes.io/region: zoneC
  - storageArrayId: "REPLACE_ZONING_SYSTEMID"
    # primaryEndpoint/backupEndpoint intentionally omitted to simulate the malformed
    # array entry described in AC-001 ("one entry has missing or malformed credentials").
    labels:
      zone.topology.kubernetes.io/zone: zoneA
      zone.topology.kubernetes.io/region: zoneC
managementServers:
  - endpoint: "https://REPLACE_ENDPOINT"
    username: REPLACE_USERNAME
    password: REPLACE_PASSWORD
    skipCertificateValidation: true
