#
# Pod that mounts the SYMID-pinned PVC. Used to verify the driver can
# provision and attach a volume directly to the SYMID-pinned array.
apiVersion: v1
kind: Pod
metadata:
  name: symid-pinned-pod
spec:
  containers:
    - name: test
      image: busybox
      command: ["sleep", "3600"]
      volumeMounts:
        - name: vol
          mountPath: /data
  volumes:
    - name: vol
      persistentVolumeClaim:
        claimName: symid-pinned-pvc
