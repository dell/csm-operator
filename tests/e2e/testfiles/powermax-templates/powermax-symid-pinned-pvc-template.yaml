# PVC for SYMID-pinned volume provisioning.
# References the SYMID-pinned StorageClass (op-e2e-powermax, defined in
# powermax-storageclass-template.yaml) which carries an explicit SYMID
# parameter. Even though the zone this PVC targets contains multiple
# pooled arrays (see powermax-multiaz-pool-secret-template.yaml), the
# explicit SYMID parameter must direct provisioning to that single named
# array only, bypassing capacity-based pool selection entirely.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: symid-pinned-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: op-e2e-powermax
