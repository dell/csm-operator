# Single-array-per-zone baseline secret (legacy/current behavior).
# Used as the "before" state for the non-disruptive multi-array zone expansion
# scenario: the zone starts with exactly one array, then a second
# array is added later with the same zone label via
# powermax-multiaz-pool-secret-template.yaml.
storageArrays:
  - storageArrayId: "REPLACE_SYSTEMID"
    primaryEndpoint: "https://REPLACE_ENDPOINT"
    backupEndpoint: "https://REPLACE_ENDPOINT"
    labels:
      zone.topology.kubernetes.io/zone: zoneA
      zone.topology.kubernetes.io/region: zoneC
managementServers:
  - endpoint: "https://REPLACE_ENDPOINT"
    username: REPLACE_USERNAME
    password: REPLACE_PASSWORD
    skipCertificateValidation: true
