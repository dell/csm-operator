name: podmon
image: quay.io/dell/container-storage-modules/podmon:v1.17.0
imagePullPolicy: Always
args:
  - "--labelvalue=csi-vxflexos"
  - "--skipArrayConnectionValidation=false"
  - "--driverPodLabelValue=dell-storage"
  - "--ignoreVolumelessPods=false"
  - "--arrayConnectivityPollRate=5"
  - "--arrayConnectivityConnectionLossThreshold=3"
  # Below 3 args should not be modified.
  - "--csisock=unix:/var/run/csi/csi.sock"
  - "--mode=controller"
  - "--driver-config-params=/vxflexos-config-params/driver-config-params.yaml"
env:
  - name: MY_NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: MY_POD_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
  - name: MY_POD_NAMESPACE
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace
  - name: X_CSI_METRICS_ENABLED
    value: "<X_CSI_METRICS_ENABLED>"
  - name: X_CSI_METRICS_PORT
    value: "<X_CSI_METRICS_PORT>"
  - name: X_CSI_METRICS_COLLECTION_INTERVAL
    value: "<X_CSI_METRICS_COLLECTION_INTERVAL>"
  - name: X_CSI_METRICS_TLS_CERT_FILE
    value: "<X_CSI_METRICS_TLS_CERT_FILE>"
  - name: X_CSI_METRICS_TLS_KEY_FILE
    value: "<X_CSI_METRICS_TLS_KEY_FILE>"
ports:
  - name: res-metrics
    containerPort: 8444
    protocol: TCP
volumeMounts:
  - name: socket-dir
    mountPath: /var/run/csi
  - name: vxflexos-config-params
    mountPath: /vxflexos-config-params
