name: dell-csi-replicator
image: quay.io/dell/container-storage-modules/dell-csi-replicator:v1.16.0
imagePullPolicy: IfNotPresent
args:
  - "--csi-address=$(ADDRESS)"
  - "--leader-election=true"
  - "--worker-threads=2"
  - "--retry-interval-start=1s"
  - "--retry-interval-max=300s"
  - "--timeout=300s"
  - "--context-prefix=<ReplicationContextPrefix>"
  - "--prefix=<ReplicationPrefix>"
env:
  - name: ADDRESS
    value: /var/run/csi/csi.sock
  - name: X_CSI_REPLICATION_CONFIG_DIR
    value: /<DriverConfigParamsVolumeMount>
  - name: X_CSI_REPLICATION_CONFIG_FILE_NAME
    value: driver-config-params.yaml
  - name: X_CSI_REPLICATION_METRICS_ENABLED
    value: "<X_CSI_REPLICATION_METRICS_ENABLED>"
  - name: X_CSI_REPLICATION_METRICS_PORT
    value: "<X_CSI_REPLICATION_METRICS_PORT>"
  - name: X_CSI_REPLICATION_METRICS_COLLECTION_INTERVAL
    value: "<X_CSI_REPLICATION_METRICS_COLLECTION_INTERVAL>"
  - name: X_CSI_REPLICATION_METRICS_TLS_CERT_FILE
    value: "<X_CSI_REPLICATION_METRICS_TLS_CERT_FILE>"
  - name: X_CSI_REPLICATION_METRICS_TLS_KEY_FILE
    value: "<X_CSI_REPLICATION_METRICS_TLS_KEY_FILE>"
ports:
  - containerPort: 8445
    name: metrics
    protocol: TCP
volumeMounts:
  - name: socket-dir
    mountPath: /var/run/csi
  - name: <DriverConfigParamsVolumeMount>
    mountPath: /<DriverConfigParamsVolumeMount>
