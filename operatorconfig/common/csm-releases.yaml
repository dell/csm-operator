# csm-releases.yaml -- single source of truth for CSM Operator version tracking.
#
# Replaces (and merges) the former csm-version-mapping.yaml,
# moduleconfig/common/version-values.yaml, and the per-version
# driverconfig/{driver}/{version}/upgrade-path.yaml and
# moduleconfig/{module}/{version}/upgrade-path.yaml files.
#
# Keyed by CSM release version (spec.Version on the ContainerStorageModule CR).
# Each entity (driver or the standalone authorization-proxy-server module) under
# a release has:
#   version         -- the operatorconfig driver/module version directory to use
#                       (e.g. operatorconfig/driverconfig/powerflex/<version>/)
#   minUpgradeFrom  -- the oldest version of this entity that can be
#                       upgraded directly into version (used by IsValidUpgrade)
#   modules         -- (drivers only) the module versions bundled with this
#                       driver version, keyed by module name
#
# This file is generated/updated by .github/scripts/driver-version-update.sh and
# .github/scripts/module-version-update.sh when a new CSM release is cut;
# .github/scripts/sidecar-version-update.sh reads it to select driver versions.
# Edit by hand only for out-of-band fixes.
